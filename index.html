<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pen Fight - itz_yourEditer95</title>
<style>
  body { margin:0; background:#1a1a2e; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family: 'Segoe UI', sans-serif; color:white; }
  h1 { margin:10px; letter-spacing:2px; }
  #score { font-size:20px; margin-bottom:10px; }
  canvas { background: #e8dcc6; border-radius:12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); cursor:crosshair; touch-action:none; }
  #msg { margin-top:12px; font-size:18px; height:24px; }
  button { margin-top:10px; padding:8px 20px; border:none; border-radius:20px; background:#ff4757; color:white; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
<h1>PEN FIGHT ⚔️</h1>
<div id="score">YOU 0 - 0 BOT</div>
<canvas id="game" width="800" height="450"></canvas>
<div id="msg">Drag your BLUE pen back and release to flick!</div>
<button onclick="resetRound()">Restart Round</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');

let table = { x: 40, y: 40, w: 720, h: 370 };
let player, enemy, isDragging=false, dragStart=null, turn='player';
let pScore=0, eScore=0;
let gameOver=false;

class Pen {
  constructor(x,y,color){
    this.x=x; this.y=y; this.vx=0; this.vy=0;
    this.color=color; this.angle=0; this.va=0;
    this.w=70; this.h=12;
  }
  update(){
    this.x+=this.vx; this.y+=this.vy;
    this.angle+=this.va;
    this.vx*=0.97; this.vy*=0.97; this.va*=0.97;
    if(Math.abs(this.vx)<0.1) this.vx=0;
    if(Math.abs(this.vy)<0.1) this.vy=0;
  }
  draw(){
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle=this.color;
    ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
    ctx.fillStyle='#111'; // tip
    ctx.fillRect(this.w/2-8, -this.h/2, 8, this.h);
    ctx.restore();
  }
  isOut(){
    return this.x < table.x || this.x > table.x+table.w || this.y < table.y || this.y > table.y+table.h;
  }
  isMoving(){
    return this.vx !== 0 || this.vy !== 0 || this.va !== 0;
  }
}

function init(){
  player = new Pen(200, 225, '#1e90ff');
  enemy = new Pen(600, 225, '#ff4757');
  player.angle = Math.random()*0.5;
  enemy.angle = Math.PI + Math.random()*0.5;
}

function drawTable(){
  ctx.fillStyle='#c9b896';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#e8dcc6';
  ctx.fillRect(table.x, table.y, table.w, table.h);
  ctx.strokeStyle='rgba(0,0,0,0.1)';
  for(let i=0;i<5;i++){ ctx.strokeRect(table.x+i, table.y+i, table.w-i*2, table.h-i*2); }
  if(isDragging && dragStart){
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(dragStart.x, dragStart.y);
    ctx.strokeStyle='#1e90ff'; ctx.lineWidth=3; ctx.stroke();
    let power = Math.hypot(dragStart.x-player.x, dragStart.y-player.y);
    ctx.fillStyle='#1e90ff'; ctx.fillText('Power: '+Math.min(100, Math.floor(power/2))+'%', player.x-30, player.y-30);
  }
}

function checkCollision(a,b){
  let dx=a.x-b.x, dy=a.y-b.y;
  let dist=Math.hypot(dx,dy);
  if(dist < 60){
    let nx=dx/dist, ny=dy/dist;
    let speed = Math.hypot(a.vx-a.vy, a.vy) + Math.hypot(b.vx,b.vy) || 5;
    a.vx += nx* speed*0.5; a.vy += ny* speed*0.5; a.va += (Math.random()-0.5)*0.3;
    b.vx -= nx* speed*0.5; b.vy -= ny* speed*0.5; b.va += (Math.random()-0.5)*0.3;
  }
}

function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawTable();
  player.update(); enemy.update();
  checkCollision(player, enemy);
  player.draw(); enemy.draw();

  // Check if it's bot's turn and pens have stopped moving
  if(!gameOver && turn === 'bot' && !player.isMoving() && !enemy.isMoving()){
    botMove();
  }

  if(!gameOver){
    if(player.isOut()){ eScore++; endRound('You fell! BOT wins'); }
    if(enemy.isOut()){ pScore++; endRound('BOT fell! YOU win'); }
  }
  requestAnimationFrame(loop);
}

function endRound(text){
  gameOver=true;
  msgEl.textContent=text;
  scoreEl.textContent=`YOU ${pScore} - ${eScore} BOT`;
  if(pScore>=3 || eScore>=3){
    setTimeout(()=>{ msgEl.textContent= pScore>=3 ? 'CHAMPION! YOU WON 🏆' : 'Game Over! BOT Won'; },500);
  } else {
    setTimeout(resetRound, 1500);
  }
}

function resetRound(){
  gameOver=false;
  turn='player';
  init();
  msgEl.textContent = 'Your turn! Drag & flick!';
}

function botMove(){
  if(gameOver) return;
  let angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
  let power = 12 + Math.random()*8;
  enemy.vx = Math.cos(angle)*power;
  enemy.vy = Math.sin(angle)*power;
  enemy.va = (Math.random()-0.5)*0.5;
  turn='player';
  msgEl.textContent='Your turn! Drag & flick!';
}

canvas.addEventListener('pointerdown', e=>{
  if(gameOver || turn!=='player' || player.isMoving() || enemy.isMoving()) return;
  let rect=canvas.getBoundingClientRect();
  let x=(e.clientX-rect.left)*canvas.width/rect.width;
  let y=(e.clientY-rect.top)*canvas.height/rect.height;
  if(Math.hypot(x-player.x, y-player.y) < 50){
    isDragging=true; dragStart={x,y};
  }
});
canvas.addEventListener('pointermove', e=>{
  if(!isDragging) return;
  let rect=canvas.getBoundingClientRect();
  dragStart.x=(e.clientX-rect.left)*canvas.width/rect.width;
  dragStart.y=(e.clientY-rect.top)*canvas.height/rect.height;
});
canvas.addEventListener('pointerup', e=>{
  if(!isDragging) return;
  isDragging=false;
  let dx=player.x - dragStart.x;
  let dy=player.y - dragStart.y;
  let power=Math.min(25, Math.hypot(dx,dy)/6);
  let ang=Math.atan2(dy,dx);
  player.vx=Math.cos(ang)*power;
  player.vy=Math.sin(ang)*power;
  player.va=(Math.random()-0.5)*0.4;
  turn='bot';
  msgEl.textContent='Nice shot! Bot thinking...';
});

init(); loop();
</script>
</body>
</html>
